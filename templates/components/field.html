{% if field.is_hidden %}
  {{ field }}
  {{ field.errors }}
{% else %}
  <div class="field">
    {{ field.label_tag }}
    {% if field.help_text %}
      <div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
    {% endif %}
    {{ field }}
    {{ field.errors }}
  </div>
{% endif %}
